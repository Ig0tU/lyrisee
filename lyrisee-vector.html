<!DOCTYPE html>
<!-- Full file: use artifacts/lyrisee-vector.html from the Grok session if this commit is incomplete -->
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lyrisee Vector</title>
<script src="https://unpkg.com/vivus@0.4.6/dist/vivus.min.js"></script>
<style>
:root{--bg:#050508;--surface:#0c0c12;--surface2:#14141e;--border:#2a2a3a;--text:#e8e8f0;--muted:#6b6b80;--accent:#c8c8d8;--glow:rgba(255,255,255,.3)}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:ui-monospace,monospace;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
header h1{font-size:13px;font-weight:600;letter-spacing:.05em}.badge{font-size:9px;padding:2px 7px;border:1px solid var(--border);border-radius:20px;color:var(--muted)}.status{margin-left:auto;font-size:11px;color:var(--muted)}
.main{flex:1;display:grid;grid-template-columns:290px 1fr 310px;overflow:hidden}
.panel{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}.panel.right{border-right:none;border-left:1px solid var(--border)}
.panel-header{padding:10px 12px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);border-bottom:1px solid var(--border)}
.panel-body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 10px;font-family:inherit;font-size:11px;cursor:pointer;border-radius:5px}.btn.primary{background:#1a1a24;border-color:#555}.btn:disabled{opacity:.35}
.stage-wrap{display:flex;flex-direction:column;background:#000;flex:1;min-height:0}
#lyric-display{text-align:center;padding:14px 18px 6px;font-size:clamp(12px,1.8vw,17px);letter-spacing:.1em;text-transform:uppercase;color:#c8c8d8;min-height:48px}
#lyric-display .sub{display:block;font-size:.55em;letter-spacing:.14em;color:var(--muted);margin-top:3px;text-transform:none}
#stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
#svg-container{width:min(70vw,600px);height:min(52vh,440px);display:flex;align-items:center;justify-content:center}
#svg-container svg{width:100%;height:100%;stroke:#fff;fill:none;stroke-width:var(--sw,1.7);stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px var(--glow));transition:opacity .4s}
#svg-container svg.fading{opacity:0}
.transport{padding:10px 16px 12px;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:10px;align-items:center}
.director-card{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:10px;line-height:1.45;margin-bottom:6px}
.director-card h4{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:3px}.director-card .val{color:var(--accent)}
.cue-item{padding:7px 8px;background:var(--surface2);border:1px solid transparent;border-radius:5px;font-size:10px;cursor:pointer;margin-bottom:3px}.cue-item.active{border-color:#555;background:#1a1a26}
.hint{font-size:9px;color:var(--muted);line-height:1.4}
@media(max-width:1000px){.main{grid-template-columns:1fr}.panel{display:none}}
</style></head><body>
<header><h1>LYRISEE VECTOR</h1><span class="badge">semantic director</span><span class="badge">calligram</span><span class="status" id="status">Idle</span></header>
<div class="main">
<div class="panel"><div class="panel-header">Source</div><div class="panel-body">
<button class="btn primary" id="btnDemo" style="width:100%">Load semantic demo</button>
<button class="btn" id="btnPlay" disabled style="width:100%;margin-top:8px">Play</button>
<button class="btn" id="btnPause" disabled style="width:100%;margin-top:4px">Pause</button>
<p class="hint" style="margin-top:12px">Pipeline: statement meaning → stanza context → continuous theme → letters shaped as silhouette → Vivus stroke-draw.</p>
</div></div>
<div class="stage-wrap">
<div id="lyric-display">Waiting<span class="sub">load semantic demo</span></div>
<div id="stage"><div id="svg-container"></div></div>
<div class="transport"><span id="timeDisplay" style="font-size:10px;color:var(--muted)">0:00</span></div>
</div>
<div class="panel right"><div class="panel-header">Director</div><div class="panel-body">
<div id="cueList"></div>
<div class="director-card"><h4>Statement meaning</h4><div class="val" id="dirMeaning">—</div></div>
<div class="director-card"><h4>Stanza context</h4><div class="val" id="dirContext">—</div></div>
<div class="director-card"><h4>Theme link</h4><div class="val" id="dirTheme">—</div></div>
<div class="director-card"><h4>Visual (letters → form)</h4><div class="val" id="dirVisual">—</div></div>
</div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const PIECE_THEME={core:'organic life meeting digital signal — memory in soil and circuit',arc:['grounding','perception','fracture','transmission','memory','ascent','escape','witness','consumption']};
const DEMO=[
{time:0,text:'Roots locked in the underground frost',meaning:'Life fixed, cold, buried; survival as endurance.',context:'Opening: self as plant-matter below surface.',themeLink:'Grounding — organic origin before signal.',visual:'ROOTS/FROST letter strokes as branching roots.',concept:'roots',keyWords:['ROOTS','FROST']},
{time:4,text:'Eyes track the digital sky',meaning:'Perception turns upward; watching becomes electronic.',context:'Buried self looks at constructed data heaven.',themeLink:'Perception — earth-bound to screen-bound.',visual:'EYES/SKY along almond eye contour.',concept:'eye',keyWords:['EYES','SKY']},
{time:8,text:'Fractured frequencies collapse into light',meaning:'Broken transmission becomes illumination.',context:'Digital sky unstable; breaking is meaning.',themeLink:'Fracture — organic/digital rupture.',visual:'LIGHT/FRACTURE as prism facets.',concept:'prism',keyWords:['LIGHT','FRACTURE']},
{time:12.2,text:'Waves of signal fold into silence',meaning:'Information decays into quiet.',context:'Post-fracture calm.',themeLink:'Transmission ending.',visual:'WAVE/SILENCE on undulating paths.',concept:'wave',keyWords:['WAVE','SILENCE']},
{time:16.5,text:'A circuit remembers the pulse',meaning:'Hardware holds organic rhythm.',context:'Dual memory: frost and silicon.',themeLink:'Memory — soil vs circuit.',visual:'CIRCUIT/PULSE on chip die.',concept:'circuit',keyWords:['CIRCUIT','PULSE']},
{time:20.8,text:'Mountains rise from static',meaning:'Form emerges from noise.',context:'Elevation after memory.',themeLink:'Ascent — form from residue.',visual:'MOUNTAIN on ridgelines.',concept:'mountain',keyWords:['MOUNTAIN','STATIC']},
{time:25,text:'Bird cuts the black horizon',meaning:'Living vector breaks the frame.',context:'Escape from the system.',themeLink:'Escape.',visual:'BIRD as wing arcs.',concept:'bird',keyWords:['BIRD','HORIZON']},
{time:29.2,text:'Moon holds the last frequency',meaning:'Remote body keeps final signal.',context:'Cosmic archive.',themeLink:'Witness.',visual:'MOON crescent from letter strokes.',concept:'moon',keyWords:['MOON','FREQUENCY']},
{time:33.5,text:'Fire in the void',meaning:'Origin and end as combustion in absence.',context:'Final synthesis.',themeLink:'Consumption.',visual:'FIRE/VOID as flame in circle.',concept:'fire',keyWords:['FIRE','VOID']}
];
const GLYPHS={A:['M1 14 L5 1 L9 14','M3 9 H7'],B:['M2 1 V13','M2 1 H6 Q9 1 9 4 Q9 7 6 7 H2','M2 7 H6.5 Q9 7 9 10 Q9 13 6.5 13 H2'],C:['M9 3 Q6.5 1 4 1 Q1 1 1 7 Q1 13 4 13 Q6.5 13 9 11'],D:['M2 1 V13','M2 1 H5.5 Q9 1 9 7 Q9 13 5.5 13 H2'],E:['M8 1 H2 V13 H8','M2 7 H6'],F:['M8 1 H2 V13','M2 7 H6'],G:['M9 3 Q6.5 1 4 1 Q1 1 1 7 Q1 13 4 13 Q7 13 9 11 V8 H6'],H:['M2 1 V13','M8 1 V13','M2 7 H8'],I:['M3 1 H7','M5 1 V13','M3 13 H7'],J:['M6 1 H9 V10 Q9 13 5 13 Q2 13 2 10'],K:['M2 1 V13','M8 1 L2 7 L8 13'],L:['M2 1 V13 H8'],M:['M1 13 V1 L5 8 L9 1 V13'],N:['M2 13 V1 L8 13 V1'],O:['M5 1 Q1 1 1 7 Q1 13 5 13 Q9 13 9 7 Q9 1 5 1'],P:['M2 13 V1 H6 Q9 1 9 4.5 Q9 8 6 8 H2'],Q:['M5 1 Q1 1 1 7 Q1 13 5 13 Q9 13 9 7 Q9 1 5 1','M6 10 L9 14'],R:['M2 13 V1 H6 Q9 1 9 4.5 Q9 8 6 8 H2','M5 8 L9 13'],S:['M8.5 3 Q6.5 1 4 1 Q1.5 1 1.5 4 Q1.5 7 5 7 Q8.5 7 8.5 10.5 Q8.5 13 5 13 Q2.5 13 1.5 11'],T:['M1 1 H9','M5 1 V13'],U:['M2 1 V10 Q2 13 5 13 Q8 13 8 10 V1'],V:['M1 1 L5 13 L9 1'],W:['M0.5 1 L2.5 13 L5 5 L7.5 13 L9.5 1'],X:['M1 1 L9 13','M9 1 L1 13'],Y:['M1 1 L5 7 L9 1','M5 7 V13'],Z:['M1 1 H9 L1 13 H9'],' ':[]};
function letterPaths(ch,ox,oy,scale){const g=GLYPHS[ch.toUpperCase()];if(!g)return[];return g.map(d=>{let out='',tokens=d.match(/[MLHVQ]|-?[\d.]+/g)||[],i=0,cmd='',pair=0;while(i<tokens.length){const t=tokens[i];if(/[MLHVQ]/.test(t)){cmd=t;out+=t;pair=0;i++;continue}const n=parseFloat(t);if(cmd==='H')out+=(ox+n*scale).toFixed(1);else if(cmd==='V')out+=(oy+n*scale).toFixed(1);else{out+=(pair%2===0?ox+n*scale:oy+n*scale).toFixed(1);pair++}out+=' ';i++}return out.trim()})}
function pathsFromWord(word,x,y,scale){const paths=[];let cx=x;for(const ch of word){paths.push(...letterPaths(ch,cx,y,scale));cx+=(ch===' '?4:10)*scale*1.05}return paths}
function wrapSvg(ds){return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">${ds.map(d=>`<path d="${d}"/>`).join('')}</svg>`}
function buildCalligram(concept,keys){const w0=(keys&&keys[0])||'FORM',w1=(keys&&keys[1])||'',paths=[];
if(concept==='roots'){paths.push('M20 160 Q100 150 180 160',...pathsFromWord(w0,68,68,1.05),'M100 95 L55 55','M100 110 L40 80','M100 125 L50 150','M100 95 L150 50','M100 115 L165 85','M100 130 L155 145');if(w1)paths.push(...pathsFromWord(w1,28,38,.65))}
else if(concept==='eye'){paths.push('M15 100 Q100 30 185 100 Q100 170 15 100 Z','M100 78 A22 22 0 1 1 99.9 78','M100 90 A8 8 0 1 1 99.9 90',...pathsFromWord(w0,55,52,.8));if(w1)paths.push(...pathsFromWord(w1,68,125,.65));paths.push('M100 20 L100 40','M100 160 L100 180','M20 100 L40 100','M160 100 L180 100')}
else if(concept==='prism'){paths.push('M100 25 L170 80 L145 170 L55 170 L30 80 Z','M100 25 L100 115','M100 115 L170 80','M100 115 L145 170','M100 115 L55 170','M100 115 L30 80',...pathsFromWord(w0,62,95,.7));if(w1)paths.push(...pathsFromWord(w1,38,40,.5))}
else if(concept==='wave'){paths.push('M10 80 Q40 30 70 80 T130 80 T190 80','M10 110 Q40 60 70 110 T130 110 T190 110','M10 140 Q40 90 70 140 T130 140 T190 140',...pathsFromWord(w0,48,52,.85));if(w1)paths.push(...pathsFromWord(w1,42,155,.6))}
else if(concept==='circuit'){paths.push('M70 70 H130 V130 H70 Z','M100 30 V70','M100 130 V170','M30 100 H70','M130 100 H170','M100 30 A5 5 0 1 1 99.9 30','M100 170 A5 5 0 1 1 99.9 170','M30 100 A5 5 0 1 1 29.9 100','M170 100 A5 5 0 1 1 169.9 100',...pathsFromWord(w0,48,95,.5));if(w1)paths.push(...pathsFromWord(w1,55,145,.5))}
else if(concept==='mountain'){paths.push('M15 165 L55 70 L90 120 L130 45 L185 165 Z','M55 70 L70 95','M130 45 L145 80',...pathsFromWord(w0,32,140,.5));if(w1)paths.push(...pathsFromWord(w1,55,28,.5))}
else if(concept==='bird'){paths.push('M30 105 Q100 40 170 105','M30 105 Q100 85 170 105','M100 80 V125 L85 150','M100 125 L115 150','M100 72 A4 4 0 1 1 99.9 72',...pathsFromWord(w0,70,52,.7));if(w1)paths.push(...pathsFromWord(w1,52,160,.5))}
else if(concept==='moon'){paths.push('M125 35 A65 65 0 1 0 125 165 A48 48 0 1 1 125 35',...pathsFromWord(w0,38,90,.75));if(w1)paths.push(...pathsFromWord(w1,32,160,.45))}
else if(concept==='fire'){paths.push('M100 170 C55 145 50 95 85 60 C70 95 90 105 100 75 C110 105 130 95 115 60 C150 95 145 145 100 170 Z','M100 170 C80 150 78 120 95 100 C90 120 100 125 100 110 C100 125 110 120 105 100 C122 120 120 150 100 170 Z',...pathsFromWord(w0,72,125,.65));if(w1)paths.push(...pathsFromWord(w1,75,38,.55))}
else{paths.push('M100 30 A70 70 0 1 1 99.9 30','M100 60 A40 40 0 1 1 99.9 60',...pathsFromWord(w0,70,95,.8))}
return wrapSvg(paths)}
let cues=[],idx=-1,vivus=null,playing=false,startOff=0,t0=0,raf=null;
function showDir(c){$('dirMeaning').textContent=c.meaning||'—';$('dirContext').textContent=c.context||'—';$('dirTheme').textContent=c.themeLink||'—';$('dirVisual').textContent=c.visual||'—'}
function renderList(){const list=$('cueList');list.innerHTML='';cues.forEach((c,i)=>{const d=document.createElement('div');d.className='cue-item'+(i===idx?' active':'');d.innerHTML=`<div style="color:var(--muted);font-size:9px">${c.time}s · ${c.concept}</div><div>${c.text}</div>`;d.onclick=()=>{idx=i;renderCue(c);renderList()};list.appendChild(d)})}
function renderCue(c){showDir(c);$('lyric-display').innerHTML=c.text+`<span class="sub">${c.concept} · calligram</span>`;const html=buildCalligram(c.concept,c.keyWords);const tmp=document.createElement('div');tmp.innerHTML=html;const svg=tmp.querySelector('svg');const id='v'+Date.now();svg.id=id;svg.querySelectorAll('path').forEach(p=>{p.setAttribute('fill','none');p.setAttribute('stroke','#fff');p.setAttribute('stroke-linecap','round')});const box=$('svg-container');const prev=box.querySelector('svg');if(prev)prev.classList.add('fading');setTimeout(()=>{box.innerHTML=svg.outerHTML;if(vivus)try{vivus.stop()}catch(e){}try{vivus=new Vivus(id,{type:'delayed',duration:140,animTimingFunction:Vivus.EASE_OUT,start:'autostart'})}catch(e){console.warn(e)}},300)}
function tick(){const t=playing?startOff+(performance.now()-t0)/1000:startOff;$('timeDisplay').textContent=Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');let next=-1;for(let i=0;i<cues.length;i++)if(t>=cues[i].time)next=i;if(next!==-1&&next!==idx){idx=next;renderCue(cues[idx]);renderList()}if(playing){if(t>cues[cues.length-1].time+5){playing=false;$('status').textContent='Complete';$('btnPlay').disabled=false}else raf=requestAnimationFrame(tick)}}
$('btnDemo').onclick=()=>{cues=DEMO.map(c=>({...c}));idx=-1;startOff=0;renderList();$('btnPlay').disabled=false;$('status').textContent='Demo loaded';$('lyric-display').innerHTML='Semantic demo ready<span class="sub">meaning → theme → letters as silhouette</span>'};
$('btnPlay').onclick=()=>{if(!cues.length)return;playing=true;t0=performance.now();if(idx<0){idx=0;renderCue(cues[0])}else startOff=cues[idx].time;$('btnPlay').disabled=true;$('btnPause').disabled=false;$('status').textContent='Playing';raf=requestAnimationFrame(tick)};
$('btnPause').onclick=()=>{playing=false;startOff=startOff+(performance.now()-t0)/1000;if(raf)cancelAnimationFrame(raf);$('btnPlay').disabled=false;$('btnPause').disabled=true;$('status').textContent='Paused'};
$('status').textContent='Ready — load semantic demo';
</script></body></html>
